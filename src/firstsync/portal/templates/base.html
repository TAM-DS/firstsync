<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}FirstSync{% endblock %}</title>
  <style>
    :root {
      --ink: #1a2b3c; --muted: #5b6b7b; --line: #e3e8ee; --bg: #f7f9fc;
      --accent: #2563eb; --ok: #15803d; --warn: #b45309; --stop: #b91c1c; --ask: #6d28d9;
      --card: #ffffff;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--ink);
      font: 15px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    header { background: var(--card); border-bottom: 1px solid var(--line); }
    .wrap { max-width: 920px; margin: 0 auto; padding: 0 24px; }
    header .wrap { display: flex; align-items: center; gap: 12px; height: 60px; }
    header a.brand { font-weight: 700; color: var(--ink); text-decoration: none; font-size: 17px; }
    header .tag { color: var(--muted); font-size: 13px; }
    main { padding: 28px 0 64px; }
    h1 { font-size: 24px; margin: 0 0 4px; }
    h2 { font-size: 17px; margin: 28px 0 10px; }
    p.lead { color: var(--muted); margin-top: 0; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px;
      padding: 18px 20px; margin: 14px 0; }
    table { border-collapse: collapse; width: 100%; font-size: 14px; }
    th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line);
      vertical-align: top; }
    th { color: var(--muted); font-weight: 600; font-size: 12px; text-transform: uppercase;
      letter-spacing: .03em; }
    code { background: #eef2f7; border-radius: 4px; padding: 1px 5px; font-size: 13px; }
    .btn { display: inline-block; background: var(--accent); color: #fff; border: 0;
      border-radius: 8px; padding: 10px 18px; font-size: 14px; font-weight: 600;
      cursor: pointer; text-decoration: none; }
    .btn.secondary { background: #fff; color: var(--ink); border: 1px solid var(--line); }
    .btn:disabled { opacity: .5; cursor: not-allowed; }
    .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-top: 14px; }
    .pill { display: inline-block; border-radius: 999px; padding: 2px 10px; font-size: 12px;
      font-weight: 600; }
    .pill.clean { background: #e7f6ec; color: var(--ok); }
    .pill.warning { background: #fdf0e3; color: var(--warn); }
    .pill.needs_decision { background: #f0e9fb; color: var(--ask); }
    .pill.blocking { background: #fbe9e9; color: var(--stop); }
    .pill.custom { background: #eef2f7; color: var(--muted); }
    .steps { display: flex; gap: 6px; font-size: 12px; color: var(--muted); margin: 0 0 18px; }
    .steps span.on { color: var(--accent); font-weight: 700; }
    .muted { color: var(--muted); }
    .big { font-size: 30px; font-weight: 700; }
    ul.plain { margin: 6px 0; padding-left: 18px; }
    .banner { border-left: 3px solid var(--accent); background: #eef4ff; padding: 10px 14px;
      border-radius: 0 8px 8px 0; font-size: 14px; }
  </style>
</head>
<body>
  <header><div class="wrap">
    <a class="brand" href="/">FirstSync</a>
    <span class="tag">customer onboarding — Claude proposes, a person authorizes</span>
  </div></header>
  <main><div class="wrap">
    {% block body %}{% endblock %}
  </div></main>
</body>
</html>
