# Fly.io config for the FirstSync demo portal.
# First run: `fly launch --no-deploy` to pick an app name and region, then `fly deploy`.
# Rename the app below to whatever `fly launch` assigns (or set your own).

app = "firstsync-demo"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  FIRSTSYNC_PORTAL_PORT = "8000"
  FIRSTSYNC_STATE_DIR = "/data"

[http_service]
  internal_port = 8000
  force_https = true
  # Scale to zero: the machine stops when idle and wakes on the next request, so a
  # low-traffic demo costs almost nothing between visits.
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    method = "GET"
    path = "/healthz"
    interval = "15s"
    timeout = "2s"

# Demo state is ephemeral and reset-able in the UI, so no persistent volume is attached.
# For durable demo state, attach a volume and point FIRSTSYNC_STATE_DIR at its mount.
[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
